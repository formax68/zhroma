<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zhroma — priority tinting status</title>
<style>
  /* Layout only. The product palette lives in zhroma.css and nowhere else. */
  body { width: 22rem; margin: 0; padding: 0.9rem 1rem; font: 0.875rem/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 0.35rem; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  p { margin: 0; }
  label { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.55rem; }
  input:disabled + span { opacity: 0.55; }
  fieldset { margin: 0.8rem 0 0; padding: 0.5rem; }
  #zhroma-theme-choices { max-height: 20rem; overflow-y: auto; }
  .theme-choice { display: grid; grid-template-columns: auto 1fr; align-items: start; padding: 0.4rem; }
  .theme-choice:focus-within { outline: 2px solid currentColor; outline-offset: -2px; }
  .theme-preview { display: grid; grid-template-columns: 3rem repeat(4, 1fr); gap: 2px; margin-top: 0.2rem; }
  .theme-swatch { height: 1rem; border: 1px solid GrayText; }
  #zhroma-theme-order { margin-bottom: 0.35rem; font-size: 0.75rem; }
</style>
</head>
<body>
<h1>Zhroma</h1>
<label><input type="checkbox" id="zhroma-enabled" disabled><span>Enable priority tinting</span></label>
<p id="zhroma-status" role="status">Checking this view</p>
<fieldset><legend>Theme</legend>
<p id="zhroma-theme-order">Preview order: Urgent, High, Normal, Low</p>
<div id="zhroma-theme-choices"></div>
</fieldset>
<p id="zhroma-theme-status" role="status"></p>
<script src="zhroma-colour.js"></script>
<script src="zhroma-themes.js"></script>
<script src="zhroma-settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
